name: Compatibility matrix

# boti-dask sits between boti and the monthly Dask release train. This job
# proves the floor, the locked and the latest versions of both on every push,
# weekly, and on demand (workflow_dispatch, or a repository_dispatch of type
# upstream-release sent by a dependency's publish workflow).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release]

jobs:
  matrix:
    name: dask ${{ matrix.dask }} / boti ${{ matrix.boti }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dask: floor, boti: floor }
          - { dask: locked, boti: locked }
          - { dask: latest, boti: latest }
          - { dask: latest, boti: locked }
          - { dask: locked, boti: latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Pin Dask to the floor
        if: matrix.dask == 'floor'
        run: uv pip install "dask[dataframe,distributed]==2026.3.0"

      - name: Upgrade Dask to the latest release
        if: matrix.dask == 'latest'
        run: uv pip install --upgrade "dask[dataframe,distributed]"

      - name: Pin boti to the floor
        if: matrix.boti == 'floor'
        run: uv pip install "boti==1.0.2"

      - name: Upgrade boti to the latest release
        if: matrix.boti == 'latest'
        run: uv pip install --upgrade boti

      - name: Show resolved versions
        run: uv pip list | grep -iE '^(dask|distributed|boti|pandas|fsspec) '

      - name: Test
        run: uv run --no-sync pytest tests/ --tb=short -q
