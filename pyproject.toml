[project]
name = "boti-dask"
version = "1.1.0"
description = "Dask runtime and resilience utilities for the Boti ecosystem"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Luis Valverde"}
]
maintainers = [
    {name = "Luis Valverde", email = "lvalverdeb@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boti>=1.0.2,<2.0.0",
    "dask[dataframe,distributed]>=2026.3.0,<2027.0.0",
    "pandas>=3.0.2,<4.0.0",
]

[project.optional-dependencies]
extra = [
    "numpy>=2.3.0,<3.0.0",
    "polars>=1.29.0,<2.0.0",
    "pyarrow>=23.0.1,<24.0.0",
]
# Cluster backends for boti_dask.clusters / DaskSessionSettings.cluster_kind.
k8s = ["dask-kubernetes>=2025.1.0,<2027.0.0"]
slurm = ["dask-jobqueue>=0.9.0,<1.0.0"]
coiled = ["coiled>=1.0.0,<2.0.0"]
# OpenTelemetryProvider (boti_dask.telemetry).
otel = ["opentelemetry-api>=1.30.0,<2.0.0", "opentelemetry-sdk>=1.30.0,<2.0.0"]

[project.urls]
Homepage = "https://github.com/lvalverdeb/boti-dask"
Repository = "https://github.com/lvalverdeb/boti-dask"
Documentation = "https://github.com/lvalverdeb/boti-dask#readme"
Issues = "https://github.com/lvalverdeb/boti-dask/issues"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.0.0",
    "ruff>=0.11.0",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
    "mike>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
boti_dask = ["py.typed"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["boti_dask*"]
